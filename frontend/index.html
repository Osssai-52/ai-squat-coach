<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 스쿼트 코치</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ========== ① 시작 화면 ========== -->
  <section id="screen-start" class="screen screen-start">
    <div class="app-logo">🏋️ AI 스쿼트 코치<small>실시간 자세 분석 · 음성 피드백</small></div>

    <div class="exercise-card">
      <div class="ic">🦵</div>
      <div><b>스쿼트</b><small>측면 촬영 · 4가지 자세 오류 감지</small></div>
    </div>

    <div class="stance-guide">
      <svg width="52" height="76" viewBox="0 0 52 76" aria-label="측면 스탠스 안내">
        <circle cx="30" cy="10" r="7" fill="none" stroke="#c3c2b7" stroke-width="2.5"/>
        <path d="M30 17 L28 40 L20 56 L20 72 M28 40 L34 56 L34 72 M29 24 L38 38" fill="none" stroke="#c3c2b7" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M4 66 h44" stroke="#2c2c2a" stroke-width="2"/>
      </svg>
      <p><b>옆으로 서 주세요</b><br/>카메라에 몸 옆면이 보이고<br/>발끝~머리까지 전신이<br/>화면에 들어와야 합니다</p>
    </div>

    <div class="goal-select">
      <div class="goal-label">목표 횟수</div>
      <div class="rep-goal">
        <button class="chip" data-goal="5">5회</button>
        <button class="chip on" data-goal="10">10회</button>
        <button class="chip" data-goal="15">15회</button>
      </div>
    </div>

    <button id="btn-start" class="btn-primary">운동 시작</button>
    <div id="start-status" class="status"></div>
  </section>

  <!-- ========== ② 운동 화면 ========== -->
  <section id="screen-workout" class="screen screen-workout hidden">
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>

      <div id="feedback" class="feedback hidden"></div>

      <div class="rep-hud">
        <div><span id="rep-count" class="num">0</span><span id="rep-goal-display" class="den"> / 10</span></div>
        <div id="squat-phase" class="phase">준비</div>
      </div>

      <div id="rep-dots" class="rep-dots"></div>

      <div class="workout-ctrl">
        <button id="btn-end" class="btn-ghost">운동 종료</button>
      </div>
      <button id="btn-debug" class="debug-toggle">디버그 ⚙</button>
      <div id="status" class="status overlay-status"></div>
    </div>

    <aside id="debug-panel" class="panel hidden">
      <h2>디버그</h2>
      <dl>
        <dt>무릎 각도</dt><dd id="knee-angle">–</dd>
        <dt>고관절 각도</dt><dd id="hip-angle">–</dd>
        <dt>허리 기울기</dt><dd id="trunk-lean">–</dd>
      </dl>
    </aside>
  </section>

  <!-- ========== ③ 리포트 화면 ========== -->
  <section id="screen-report" class="screen screen-report hidden">
    <h1>운동 결과</h1>

    <div class="hero-row">
      <div class="stat-tile">
        <div class="label">정상 자세</div>
        <div class="value good"><span id="report-good">0</span><small> / <span id="report-total">0</span>회</small></div>
      </div>
      <div class="stat-tile">
        <div class="label">가장 잦은 오류</div>
        <div id="report-top-error" class="value sub">없음</div>
      </div>
    </div>

    <div class="dist-chart">
      <div class="label">자세 분포</div>
      <div id="dist-bar" class="bar" role="img"></div>
      <div id="dist-legend" class="legend"></div>
    </div>

    <ul id="rep-list" class="rep-list"></ul>

    <div class="report-actions">
      <button id="btn-again" class="btn-primary">다시 하기</button>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
